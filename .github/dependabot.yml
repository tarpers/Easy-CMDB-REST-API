version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for new releases to settle before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for new releases to settle before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
