[project]
name = "easy-cmdb-rest-api"
version = "0.1.0"
description = "REST API for Easy CMDB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "easy_cmdb_rest_api.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.112",
]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "FAST"]
